# Start with the repository root as prefix:
# nginx -e stderr -p /absolute/path/to/wanzhongxiang/ -c deploy/nginx/nginx.conf
worker_processes 1;
pid deploy/nginx/nginx.pid;
error_log deploy/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log deploy/nginx/access.log;
    client_body_temp_path deploy/nginx/logs/client_temp;
    proxy_temp_path deploy/nginx/logs/proxy_temp;
    fastcgi_temp_path deploy/nginx/logs/fastcgi_temp;
    uwsgi_temp_path deploy/nginx/logs/uwsgi_temp;
    scgi_temp_path deploy/nginx/logs/scgi_temp;
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8081;
        server_name localhost;
        root frontend/admin/dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /api/ai/chat/stream {
            proxy_pass http://127.0.0.1:8080/admin/ai/chat/stream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 120s;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8080/admin/;
            proxy_set_header Host $host;
        }

        location /user/ {
            proxy_pass http://127.0.0.1:8080/user/;
        }

        location /ws/ {
            proxy_pass http://127.0.0.1:8080/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
    }
}
